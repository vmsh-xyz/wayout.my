<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wayout.my</title>
    <link rel="icon" type="image/png" href="favicon-256.png">
    <meta name="description" content="coming soon
all work our own">
    <meta property="og:image" content="https://wayout.my/favicon-256.png">
    <meta property="og:image:type" content="image/jpeg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://wayout.my/favicon-256.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html {
            background-color: #000000;
            height: 100%;
            transition: filter 0.3s ease;
        }

        html.theme-white {
            filter: invert(1);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .door-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .door {
            width: 200px;
            height: 420px;
            background-image: url('img/wayoutdoor.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }

        .door-handle {
            position: absolute;
            right: 18px;
            top: 55%;
            width: 10px;
            height: 10px;
            background-color: #222222;
            border-radius: 50%;
        }

        .doorbell-container {
            position: absolute;
            left: calc(100% + 20px);
            top: 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .doorbell {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border: 6px solid #ff1e02;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(255, 255, 255, 0.2);
            transition: transform 0.1s ease;
            box-sizing: content-box;
        }

        .doorbell:hover {
            transform: scale(1.1);
        }

        .doorbell:active {
            transform: scale(0.95);
        }

        .instagram-link {
            color: #ffffff;
            font-size: 24px;
            text-decoration: none;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .instagram-link:hover {
            transform: scale(1.15);
            color: #ff1e02;
        }
    </style>
</head>

<body>

    <div class="door-wrapper">
        <div class="door">
            <div class="door-handle"></div>
        </div>
        <div class="doorbell-container">
            <button id="themeToggle" class="doorbell" aria-label="black or music"></button>
            <a href="https://www.instagram.com/wayout.my/" target="_blank" rel="noopener noreferrer" class="instagram-link" aria-label="Instagram Profile">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');

        const doorbellSound = new Audio('westlife.mp3');

        themeToggleBtn.addEventListener('click', () => {
            const isWhiteTheme = document.documentElement.classList.toggle('theme-white');

            if (isWhiteTheme) {
                doorbellSound.currentTime = 0;
                doorbellSound.play().catch(error => {
                    console.log('Аудиото не можа да се възпроизведе:', error);
                });
            } else {
                doorbellSound.pause();
                doorbellSound.currentTime = 0;
            }
        });
    </script>

</body>

</html>
