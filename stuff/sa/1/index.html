<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерия от 22 Изображения</title>
  <style>
    /* Нулиране на базовите стилове */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Пулсиращ черен фон */
    body {
      background-color: #050505;
      animation: subtlePulse 8s ease-in-out infinite alternate;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    @keyframes subtlePulse {
      0% {
        background-color: #030305;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
      }
      50% {
        background-color: #0d0d12;
        box-shadow: inset 0 0 150px rgba(15, 23, 42, 0.6);
      }
      100% {
        background-color: #050505;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
      }
    }

    /* Главен контейнер за галерията */
    .gallery-container {
      position: relative;
      width: 100vw;
      height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Общи стилове за слайдовете */
    .slide-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      /* Бавен и плавен преход при ръчна смяна или hover */
      transition: opacity 2s ease-in-out, visibility 2s ease-in-out;
      animation: gallery22 110s infinite ease-in-out;
    }

    /* Ограничения за изображението според височината на екрана */
    .slide-item img {
      max-height: 100%;
      max-width: 95vw;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    /* При посочване с мишката галерията спира, за да разгледате текущата снимка */
    .gallery-container:hover .slide-item {
      animation-play-state: paused;
    }

    /* Автоматични забавяния (animation-delay) за 22 изображения */
    /* Всяко изображение се забавя с по 5 секунди (110s общо / 22 = 5s) */
    .slide-item:nth-child(1)  { animation-delay: 0s; }
    .slide-item:nth-child(2)  { animation-delay: 5s; }
    .slide-item:nth-child(3)  { animation-delay: 10s; }
    .slide-item:nth-child(4)  { animation-delay: 15s; }
    .slide-item:nth-child(5)  { animation-delay: 20s; }
    .slide-item:nth-child(6)  { animation-delay: 25s; }
    .slide-item:nth-child(7)  { animation-delay: 30s; }
    .slide-item:nth-child(8)  { animation-delay: 35s; }
    .slide-item:nth-child(9)  { animation-delay: 40s; }
    .slide-item:nth-child(10) { animation-delay: 45s; }
    .slide-item:nth-child(11) { animation-delay: 50s; }
    .slide-item:nth-child(12) { animation-delay: 55s; }
    .slide-item:nth-child(13) { animation-delay: 60s; }
    .slide-item:nth-child(14) { animation-delay: 65s; }
    .slide-item:nth-child(15) { animation-delay: 70s; }
    .slide-item:nth-child(16) { animation-delay: 75s; }
    .slide-item:nth-child(17) { animation-delay: 80s; }
    .slide-item:nth-child(18) { animation-delay: 85s; }
    .slide-item:nth-child(19) { animation-delay: 90s; }
    .slide-item:nth-child(20) { animation-delay: 95s; }
    .slide-item:nth-child(21) { animation-delay: 100s; }
    .slide-item:nth-child(22) { animation-delay: 105s; }

    /* Бавни и плавни ключови кадри за прехода между 22 картинки */
    @keyframes gallery22 {
      0% {
        opacity: 0;
        visibility: visible;
      }
      /* Плавно поплавяне (1.5% от 110s = ~1.65 секунди fade-in) */
      1.5% {
        opacity: 1;
        visibility: visible;
      }
      /* Задържане на изображението */
      4.545% {
        opacity: 1;
        visibility: visible;
      }
      /* Плавно изчезване (6% от 110s = ~1.65 секунди fade-out) */
      6.045% {
        opacity: 0;
        visibility: hidden;
      }
      100% {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <div class="slide-item"><img src="1.png" alt="Снимка 1"></div>
    <div class="slide-item"><img src="2.png" alt="Снимка 2"></div>
    <div class="slide-item"><img src="3.png" alt="Снимка 3"></div>
    <div class="slide-item"><img src="4.png" alt="Снимка 4"></div>
    <div class="slide-item"><img src="5.png" alt="Снимка 5"></div>
    <div class="slide-item"><img src="6.png" alt="Снимка 6"></div>
    <div class="slide-item"><img src="7.png" alt="Снимка 7"></div>
    <div class="slide-item"><img src="8.png" alt="Снимка 8"></div>
    <div class="slide-item"><img src="9.png" alt="Снимка 9"></div>
    <div class="slide-item"><img src="10.png" alt="Снимка 10"></div>
    <div class="slide-item"><img src="11.png" alt="Снимка 11"></div>
    <div class="slide-item"><img src="12.png" alt="Снимка 12"></div>
    <div class="slide-item"><img src="13.png" alt="Снимка 13"></div>
    <div class="slide-item"><img src="14.png" alt="Снимка 14"></div>
    <div class="slide-item"><img src="15.png" alt="Снимка 15"></div>
    <div class="slide-item"><img src="16.png" alt="Снимка 16"></div>
    <div class="slide-item"><img src="17.png" alt="Снимка 17"></div>
    <div class="slide-item"><img src="18.png" alt="Снимка 18"></div>
    <div class="slide-item"><img src="19.png" alt="Снимка 19"></div>
    <div class="slide-item"><img src="20.png" alt="Снимка 20"></div>
    <div class="slide-item"><img src="21.png" alt="Снимка 21"></div>
    <div class="slide-item"><img src="22.png" alt="Снимка 22"></div>
  </div>

</body>
</html>
